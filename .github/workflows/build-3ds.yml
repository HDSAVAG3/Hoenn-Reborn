name: Build Hoenn Reborn for Nintendo 3DS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          dkp-pacman -S --noconfirm 3ds-dev

          apt-get update
          apt-get install -y wget unzip imagemagick

          mkdir -p /opt/devkitpro/tools/bin

          wget -q \
            https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip \
            -O /tmp/bannertool.zip

          unzip -o /tmp/bannertool.zip -d /tmp/bannertool

          find /tmp/bannertool \
            -type f \
            -name bannertool \
            -exec cp {} /opt/devkitpro/tools/bin/bannertool \;

          chmod +x /opt/devkitpro/tools/bin/bannertool

          wget -q \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip \
            -O /tmp/makerom.zip

          unzip -o /tmp/makerom.zip -d /tmp/makerom

          find /tmp/makerom \
            -type f \
            -name makerom \
            -exec cp {} /opt/devkitpro/tools/bin/makerom \;

          chmod +x /opt/devkitpro/tools/bin/makerom

      - name: Locate project archive
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort

          ZIP_FILE="$(find . -type f -name 'Hoenn_Reborn_Milestone12_CIA_Ready.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -type f -name '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Found project archive:"
          echo "$ZIP_FILE"

          mkdir -p build/project
          unzip -q "$ZIP_FILE" -d build/project

      - name: Extract project source
        run: |
          echo "Searching for Makefile..."

          MAKEFILE="$(find build/project -type f -name Makefile -print -quit)"

          if [ -z "$MAKEFILE" ]; then
            echo "ERROR: Makefile was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$MAKEFILE")"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          echo "Final project contents:"
          find . -maxdepth 2 -type f | sort

      - name: Fix Makefile for libctru
        run: |
          cat >> Makefile <<'EOF'

          CFLAGS += -I$(DEVKITPRO)/libctru/include
          LDFLAGS += -L$(DEVKITPRO)/libctru/lib
          LIBS += -lctru

          CFLAGS += -mfloat-abi=hard -mfpu=vfp
          CXXFLAGS += -mfloat-abi=hard -mfpu=vfp
          LDFLAGS += -mfloat-abi=hard -mfpu=vfp
          EOF

      - name: Fix old console selection
        run: |
          if [ -f src/main.c ]; then
            sed -i '/consoleSelect(&consoles\[1\]);/d' src/main.c
          fi

          if [ -f src/touch_ui.c ]; then
            sed -i '/consoleSelect(&consoles\[1\]);/d' src/touch_ui.c
          fi

      - name: Fix player sprite compatibility
        run: |
          cat > src/player_sprite.c <<'EOF'
          #include "player_sprite.h"

          void player_sprite_init(PlayerSpriteState *s) {
              if (!s) return;

              s->facing = DIR_DOWN;
              s->frame = 1;
              s->moving = 0;
              s->frame_tick = 0;
          }

          void player_sprite_update(
              PlayerSpriteState *s,
              const OverworldPlayer *p,
              uint16_t delta_ticks
          ) {
              (void)delta_ticks;

              if (!s || !p) return;

              s->facing = p->facing;
              s->moving = 0;
              s->frame = 1;
              s->frame_tick = 0;
          }

          const char *player_sprite_glyph(const PlayerSpriteState *s) {
              if (!s) return "@";

              if (s->moving) {
                  if (s->facing == DIR_LEFT || s->facing == DIR_RIGHT) {
                      return (s->frame == 1)
                          ? "@"
                          : (s->frame == 0 ? "/" : "\\");
                  }

                  return (s->frame == 1)
                      ? "@"
                      : (s->frame == 0 ? "^" : "v");
              }

              switch (s->facing) {
                  case DIR_UP:
                      return "^";
                  case DIR_LEFT:
                      return "<";
                  case DIR_RIGHT:
                      return ">";
                  default:
                      return "@";
              }
          }
          EOF

      - name: Fix RGB565 definition conflict
        run: |
          if [ -f src/scene_renderer.c ]; then
            sed -i '/^[[:space:]]*#define RGB565(r,g,b)/d' src/scene_renderer.c
          fi

      - name: Verify libctru
        run: |
          echo "DEVKITPRO=$DEVKITPRO"

          test -f "$DEVKITPRO/libctru/include/3ds.h"

          echo "libctru found successfully."

      - name: Validate project
        run: |
          make validate

      - name: Build 3DSX and ELF
        run: |
          make clean
          make

      - name: Prepare CIA packaging
        run: |
          mkdir -p build/cia

          echo "Checking original banner..."
          identify assets/banner/banner.png

          echo "Converting banner to 256x128..."

          convert assets/banner/banner.png \
            -resize 256x128! \
            -background "#000000" \
            -gravity center \
            -extent 256x128 \
            PNG32:build/cia/banner.png

          echo "Final banner:"
          identify build/cia/banner.png

          cat > tools/package_cia.sh <<'EOF'
          #!/bin/sh
          set -eu

          ELF="${1:-hoenn_reborn.elf}"
          CIA="${2:-hoenn_reborn.cia}"

          DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"

          BANNERTOOL="${BANNERTOOL:-$DEVKITPRO/tools/bin/bannertool}"
          MAKEROM="${MAKEROM:-$DEVKITPRO/tools/bin/makerom}"

          BANNER_PNG="build/cia/banner.png"
          ICON_PNG="assets/icon/icon.png"

          CIAWORK="build/cia"
          BANNER_BNR="$CIAWORK/banner.bnr"
          ICON_ICN="$CIAWORK/icon.icn"
          SILENCE_WAV="$CIAWORK/silence.wav"

          echo "=========================================="
          echo "Hoenn Reborn CIA packaging"
          echo "=========================================="

          echo "ELF:        $ELF"
          echo "CIA:        $CIA"
          echo "bannertool: $BANNERTOOL"
          echo "makerom:    $MAKEROM"

          test -f "$ELF"
          test -x "$BANNERTOOL"
          test -x "$MAKEROM"
          test -f "$BANNER_PNG"
          test -f "$ICON_PNG"

          echo "Creating silent banner audio..."

          python3 - "$SILENCE_WAV" <<'PY'
          import sys
          import wave

          output = sys.argv[1]

          sample_rate = 22050
          seconds = 3

          frames = b"\x00\x00" * (sample_rate * seconds)

          with wave.open(output, "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              wav.writeframes(frames)

          print("Created:", output)
          PY

          echo "Creating icon..."

          "$BANNERTOOL" makesmdh \
              -s "Hoenn Reborn" \
              -l "Pokemon Emerald: Hoenn Reborn" \
              -p "HDSAVAG3" \
              -i "$ICON_PNG" \
              -o "$ICON_ICN"

          echo "Creating banner..."

          "$BANNERTOOL" makebanner \
              -i "$BANNER_PNG" \
              -a "$SILENCE_WAV" \
              -o "$BANNER_BNR"

          echo "Creating CIA..."

          "$MAKEROM" \
              -f cia \
              -o "$CIA" \
              -target t \
              -exefslogo \
              -elf "$ELF" \
              -icon "$ICON_ICN" \
              -banner "$BANNER_BNR" \
              -desc app:4

          if [ ! -s "$CIA" ]; then
              echo "ERROR: CIA was not created."
              exit 1
          fi

          echo "=========================================="
          echo "CIA CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$CIA"
          EOF

          chmod +x tools/package_cia.sh

          echo "CIA packaging preparation complete."

      - name: Build CIA
        run: |
          make cia

      - name: Verify outputs
        run: |
          echo "Checking final build files..."

          test -s hoenn_reborn.3dsx
          test -s hoenn_reborn.elf
          test -s hoenn_reborn.cia

          echo "=================================="
          echo "BUILD SUCCESSFUL"
          echo "=================================="

          echo "3DSX:"
          ls -lh hoenn_reborn.3dsx

          echo "ELF:"
          ls -lh hoenn_reborn.elf

          echo "CIA:"
          ls -lh hoenn_reborn.cia

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: hoenn-reborn-3dsx
          path: hoenn_reborn.3dsx
          retention-days: 30

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: hoenn-reborn-cia
          path: hoenn_reborn.cia
          retention-days: 30
